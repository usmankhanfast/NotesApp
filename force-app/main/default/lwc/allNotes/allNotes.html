<template>
    <lightning-card title={cardTitle} icon-name="standard:note">
        <div class="slds-grid slds-grid_vertical-align-center slds-grid_align-end ctrl-items-bar">
            <div class="slds-col search-bar">
                <lightning-input
                    type="search"
                    variant="label-hidden"
                    placeholder="Search by Title.."
                    onchange={handleSearch}
                    value={searchKey}>
                </lightning-input>
            </div>
            <div class="slds-col slds-shrink-none slds-m-left_small">
                <lightning-button-icon
                    icon-name="utility:refresh"
                    alternative-text="Refresh"
                    title="Refresh"
                    onclick={handleRefresh}
                    variant="border-filled">
                </lightning-button-icon>
            </div>
        </div>

        <template lwc:if={isLoading}>
            <lightning-spinner
                alternative-text="Loading notes"
                size="medium">
            </lightning-spinner>
        </template>

        <div class="slds-p-horizontal_medium slds-p-bottom_medium">
            <lightning-datatable
                key-field="Id"
                data={notes}
                columns={columns}
                hide-checkbox-column>
            </lightning-datatable>

            <template lwc:if={showNoRecords}>
                <div class="slds-p-around_medium slds-text-align_center">
                    No records found.
                </div>
            </template>
        </div>
    </lightning-card>
</template>
